<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="./src/script.js" type="module"></script>
    <script src="./src/graphing.js" type="module"></script>
    <script src="./src/objdetection.js" type="module"></script>
    <script src="./src/rotation-listener.js"></script>
    <script src="./src/speech.js" type="module"></script>
    <script src="./src/controller.js" type="module"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  </head>
  <style>
    #scene {
      /* width: 100%;
        height: 100%; */
    }
    .media {
      position: fixed;
      z-index: 2;
      top: 0;
      right: 0;

      transform: scaleX(-1);
      /* visibility: visible !important; */
    }
    video {
      width: 20%;
      height: 20%;
    }
    #overlay {
      position: fixed;
      z-index: 9999;
    }
    #data {
      position: fixed;
      left: 30%;
      width: 100%;
      height: 100%;
      z-index: 9999;
    }
    #controllerDiv {
      position: fixed;
      z-index: 9999;
      top: 15%;
      h1 {
        color: Black;
      }
    }
  </style>
  <body>
    <div id="data">
      <canvas graphType="acceleration"></canvas>
      <canvas graphType="velocity"></canvas>
      <canvas graphType="position"></canvas>
    </div>
    <div id="overlay">
      <h1 id="hit" style="font-size: 50px"></h1>
      <button id="bluetooth">Connect</button>
      <button id="enableAframe">Hide A-Frame</button>
      <button id="toggleBSConnection">connect to bs device</button>
      <button id="initObjectDetection">Initialize Object Detection</button>
      <button id="enableVoiceCommanding">Enable Voice</button>
      <button id="enableGameController">Connect Game Controller</button>
      <button id="showJoyPositions">Hide Joystick Positions</button>
      <!--<input id="servo1" type="range" value="0" min="0" max="180" />
      Servo 2
      <input id="servo2" type="range" value="0" min="0" max="180" />
      Servo 3
      <input id="servo3" type="range" value="0" min="0" max="180" />
      Servo 4
      <input id="servo4" type="range" value="0" min="0" max="180" />-->
    </div>
    <div id="controllerDiv">
      <h1>Stick 1 Coords:</h1>
      <h1>Stick 2 Coords:</h1>
      <h1>Button (Index) Clicked:</h1>
      <h2 id="sensitivityText">Adjust Controller Sensitivity: 50</h2>
      <input
        type="range"
        min="0"
        max="100"
        value="50"
        id="controllerSensitivity"
        style="width: 100%"
      />
    </div>

    <video id="video" class="media" autoplay playsinline></video>
    <img class="media" id="cameraImage" />

    <a-scene>
      <a-sky color="green"></a-sky>
      <a-camera id="camera" position="0 10 20" rotation="45 45 0"></a-camera>
      <a-box
        id="base"
        position="0 0 0"
        rotation="0 0 0"
        color="white"
        scale="7.62 1 7.62"
      >
      </a-box>

      <a-entity id="baseServoEntity">
        <a-box
          id="baseServo"
          scale="1.27 1.27 2.22"
          position="0 1.152 0"
          rotation="0 0 0"
          color="blue"
        ></a-box>

        <a-entity
          rotation-listener="axis: y;"
          rotary
          id="whiteArm1Entity"
          data-servo="0"
          position="0 2.482 0"
        >
          <a-box
            id="whiteArm1"
            color="white"
            scale="5.08 6.35 2.54"
            position="0 2.482 0"
            rotation="0 0 0"
          ></a-box>

          <a-entity id="servo2Entity" scale="1 1 1" position="0 6.260 0">
            <a-box
              id="servo2Box"
              scale="1.27 1.27 2.22"
              position="0 0 0"
              rotation="0 0 0"
              color="blue"
            ></a-box>

            <a-entity
              rotation-listener="axis: y;"
              rotary
              id="whiteArm2Entity"
              data-servo="1"
              position="0 1.324 0"
            >
              <a-box
                id="whiteArm2"
                color="white"
                scale="5.08 6.35 2.54"
                position="0 2.482 0"
              ></a-box>

              <a-entity
                rotation-listener="axis: x;"
                rotary
                id="whiteArm3Entity"
                data-servo="2"
                position="0 6.422 0"
              >
                <a-box
                  id="whiteArm3"
                  color="white"
                  scale="5.08 6.35 2.54"
                  position="0 2.482 0"
                ></a-box>

                <a-entity
                  rotation-listener="axis: z;"
                  rotary
                  id="servo4Entity"
                  scale="1 1 1"
                  data-servo="3"
                  position="0 6.260 0"
                >
                  <a-box
                    id="servo2"
                    scale="1.27 1.27 2.22"
                    position="0 0 0"
                    rotation="0 0 0"
                    color="blue"
                  ></a-box>

                  <a-entity
                    id="happyFaceEntity"
                    scale="1 1 1"
                    position="0 0.782 1.364"
                  >
                    <a-box
                      id="happyFace"
                      scale="3.530 1.9 0.5"
                      position="0 0 0"
                      rotation="0 0 0"
                      color="yellow"
                    ></a-box>

                    <a-sphere
                      color="black"
                      radius="0.3"
                      position="-1.162 0.278 0"
                    ></a-sphere>
                    <a-sphere
                      color="black"
                      radius="0.3"
                      position="1.215 0.278 0"
                    ></a-sphere>

                    <a-sphere
                      color="pink"
                      radius="0.3"
                      position="-0.057 -0.094 0"
                    ></a-sphere>
                  </a-entity>
                </a-entity>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-box hand position="0 10 10" color="red"></a-box>
    </a-scene>
  </body>
</html>
